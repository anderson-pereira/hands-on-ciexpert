<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AES Lab — exploração guiada</title>
  <style>
    :root {
      --bg: #0c111b;
      --panel: #131c2b;
      --panel2: #192436;
      --panel3: #0f1724;
      --line: #2a374b;
      --text: #e5ecf6;
      --muted: #a2b1c7;
      --blue: #86baff;
      --blue-soft: #203858;
      --green: #72dec4;
      --green-soft: #173a36;
      --amber: #f4cd81;
      --amber-soft: #3d321e;
      --red: #ff9ca7;
      --red-soft: #432832;
      --shadow: 0 12px 32px #0002;
      --radius: 14px
    }

    [data-theme=light] {
      --bg: #f3f5f9;
      --panel: #fff;
      --panel2: #f1f5fa;
      --panel3: #f8fafc;
      --line: #ccd6e3;
      --text: #17283e;
      --muted: #4d6179;
      --blue: #205fb1;
      --blue-soft: #e8f0fc;
      --green: #086e59;
      --green-soft: #e4f5ef;
      --amber: #7a5105;
      --amber-soft: #fff3d8;
      --red: #a62c40;
      --red-soft: #fde9ec;
      --shadow: 0 8px 30px #233c5808
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6
    }

    button,
    input,
    select {
      font: inherit
    }

    button,
    select {
      cursor: pointer
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 13px;
      line-height: 1.35;
      min-height: 38px;
      transition: background .12s, border-color .12s
    }

    button:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--blue-soft)
    }

    button:disabled {
      opacity: .42;
      cursor: default
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--bg);
      font-weight: 700
    }

    button.active,
    button[aria-pressed=true] {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue)
    }

    button.text-button {
      padding: 3px 0;
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-align: left
    }

    a {
      color: var(--blue)
    }

    :focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px
    }

    input,
    select {
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      width: 100%;
      min-width: 0
    }

    input[aria-invalid=true] {
      border-color: var(--red)
    }

    input.mono {
      font-size: 13px
    }

    .mono,
    code,
    pre {
      font-family: Consolas, 'Cascadia Code', ui-monospace, monospace;
      font-variant-numeric: tabular-nums
    }

    p {
      margin: 0 0 12px
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.25;
      margin: 0
    }

    h1 {
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -.8px
    }

    h2 {
      font-size: 19px;
      letter-spacing: -.25px
    }

    h3 {
      font-size: 15px;
      font-weight: 650
    }

    small,
    .small {
      font-size: 12px
    }

    strong {
      font-weight: 650
    }

    .muted {
      color: var(--muted)
    }

    .blue {
      color: var(--blue)
    }

    .green {
      color: var(--green)
    }

    .amber {
      color: var(--amber)
    }

    .eyebrow {
      font-size: 11px;
      color: var(--blue);
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 9px
    }

    .app-header {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px max(28px, calc((100vw - 1440px)/2));
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      gap: 20px
    }

    .brand {
      display: flex;
      gap: 15px;
      align-items: center
    }

    .brand-mark {
      font: 700 17px Consolas, monospace;
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 9px;
      border-radius: 10px
    }

    .brand strong {
      font-size: 20px;
      letter-spacing: -.4px
    }

    .brand-light {
      font-weight: 400;
      color: var(--muted)
    }

    .brand small {
      display: block;
      letter-spacing: 1.7px;
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px
    }

    .header-tools {
      display: flex;
      gap: 18px;
      align-items: center
    }

    .app-shell {
      max-width: 1440px;
      padding: 24px 28px 0;
      margin: auto
    }

    .module-nav {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 30px
    }

    .module-nav button {
      display: flex;
      align-items: center;
      text-align: left;
      gap: 11px;
      padding: 13px 12px;
      background: var(--panel);
      border-radius: 10px
    }

    .module-nav .num {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      display: grid;
      place-items: center
    }

    .module-nav button.active .num {
      background: var(--blue);
      color: var(--bg);
      border-color: var(--blue)
    }

    .module-nav strong {
      font-size: 12px;
      display: block;
      line-height: 1.3
    }

    .module-nav small {
      font-size: 10px;
      color: var(--muted);
      display: block;
      margin-top: 3px
    }

    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px
    }

    .page-heading p {
      color: var(--muted);
      max-width: 780px;
      margin: 10px 0 0;
      font-size: 14px
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap
    }

    .tag.green {
      border-color: var(--green);
      color: var(--green)
    }

    .tag.blue {
      border-color: var(--blue);
      color: var(--blue)
    }

    .tag.amber {
      border-color: var(--amber);
      color: var(--amber)
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      min-width: 0
    }

    .panel.flat {
      box-shadow: none
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0
    }

    .section-index {
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      margin-right: 9px
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px
    }

    .inputs-grid .full {
      grid-column: 1/-1
    }

    .field label {
      font-size: 12px;
      font-weight: 650;
      display: block;
      margin-bottom: 7px
    }

    .field label span {
      color: var(--muted);
      font-weight: 400;
      margin-left: 8px
    }

    .field small {
      display: block;
      color: var(--muted);
      margin-top: 5px
    }

    .field-error {
      color: var(--red) !important
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 15px
    }

    .input-footer p {
      color: var(--muted);
      font-size: 11px;
      margin: 0
    }

    .preset {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--muted)
    }

    .preset select {
      padding: 7px 9px;
      width: auto;
      max-width: 220px;
      font-size: 12px
    }

    .button-row {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap
    }

    .button-row.small-buttons button {
      font-size: 12px;
      padding: 7px 10px
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap
    }

    .step-controls {
      display: flex;
      gap: 7px;
      align-items: center
    }

    .step-counter {
      font-size: 11px;
      color: var(--muted);
      min-width: 77px;
      text-align: center
    }

    .progress-track {
      height: 3px;
      border-radius: 3px;
      background: var(--line);
      margin: 16px 0
    }

    .progress-track>div {
      height: 100%;
      background: var(--blue);
      border-radius: 3px
    }

    .rounds {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .rounds button {
      font-size: 11px;
      padding: 6px 10px;
      min-height: 32px
    }

    .operations {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 14px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .operations button {
      font-size: 12px
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.43fr) minmax(330px, 1fr);
      gap: 18px;
      align-items: start
    }

    .workspace .panel {
      margin-bottom: 18px
    }

    .compare {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px
    }

    .matrix-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px
    }

    .matrix-title h3 {
      font-size: 13px
    }

    .matrix-title small {
      font-size: 10px;
      color: var(--muted)
    }

    .matrix {
      display: grid;
      grid-template-columns: 22px repeat(4, minmax(0, 1fr));
      gap: 5px
    }

    .matrix .axis {
      font: 10px Consolas, monospace;
      color: var(--muted);
      display: grid;
      place-items: center;
      min-height: 19px
    }

    .byte {
      padding: 7px 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 7px;
      background: var(--panel3);
      font: 600 17px Consolas, monospace;
      min-height: 54px;
      position: relative
    }

    .byte small {
      font-size: 9px;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.2;
      margin-top: 5px
    }

    .byte.changed {
      border-bottom: 3px solid var(--green);
      background: var(--green-soft);
      padding-bottom: 4px
    }

    .byte.dependency {
      background: var(--blue-soft);
      border-color: var(--blue)
    }

    .byte.selected {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
      color: var(--blue)
    }

    .byte.origin {
      outline: 2px dashed var(--blue);
      outline-offset: 1px;
      color: var(--blue)
    }

    .bus {
      font-size: 10px;
      overflow-wrap: anywhere;
      color: var(--muted);
      margin-top: 13px;
      line-height: 1.8
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 10px;
      color: var(--muted);
      margin-top: 18px
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px
    }

    .legend i {
      width: 9px;
      height: 9px;
      display: inline-block;
      border-bottom: 3px solid var(--green);
      background: var(--green-soft)
    }

    .legend .chosen {
      border: 1px solid var(--blue);
      background: var(--blue-soft)
    }

    .legend .source {
      border: 1px dashed var(--blue);
      background: transparent
    }

    .stats {
      display: flex;
      gap: 24px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 18px
    }

    .stats strong {
      font: 600 20px Consolas, monospace;
      display: block
    }

    .stats small {
      font-size: 10px;
      color: var(--muted)
    }

    .inspector-path {
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin: 15px 0
    }

    .value-pair {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap
    }

    .value-pair strong {
      font: 600 29px Consolas, monospace
    }

    .value-pair .arrow {
      font-size: 19px;
      color: var(--muted)
    }

    .value-pair small {
      display: block;
      font: 11px 'Segoe UI', sans-serif;
      color: var(--muted);
      margin-bottom: 4px
    }

    .equation {
      font: 13px/1.8 Consolas, monospace;
      overflow-wrap: anywhere;
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 13px;
      margin-top: 12px
    }

    .explain {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8
    }

    .note {
      background: var(--blue-soft);
      border-left: 3px solid var(--blue);
      padding: 12px 15px;
      border-radius: 0 8px 8px 0;
      font-size: 12px;
      margin: 14px 0;
      color: var(--text)
    }

    .note.green {
      background: var(--green-soft);
      border-color: var(--green)
    }

    .note.amber {
      background: var(--amber-soft);
      border-color: var(--amber)
    }

    .note p:last-child {
      margin-bottom: 0
    }

    .note strong {
      display: block;
      margin-bottom: 4px
    }

    .bits {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 4px;
      margin-top: 12px
    }

    .bit {
      font: 12px Consolas, monospace;
      text-align: center;
      background: var(--panel2);
      border: 1px solid var(--line);
      padding: 7px 1px;
      border-radius: 5px
    }

    .bit.flip {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green)
    }

    .bit small {
      display: block;
      font-size: 8px;
      color: var(--muted);
      margin-bottom: 5px
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      align-items: center;
      flex-wrap: wrap
    }

    .detail-row:last-child {
      border-bottom: 0
    }

    .detail-row code {
      overflow-wrap: anywhere
    }

    .detail-row>span {
      color: var(--muted)
    }

    details {
      border-top: 1px solid var(--line);
      padding-top: 13px;
      margin-top: 16px
    }

    summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      color: var(--blue);
      padding: 5px 0
    }

    pre {
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 16px;
      font-size: 11px;
      line-height: 1.85;
      overflow: auto;
      color: var(--text);
      tab-size: 2;
      margin-bottom: 0
    }

    .rtl-caption {
      font-size: 10px;
      color: var(--muted);
      margin-top: 7px
    }

    .wide-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start
    }

    .flow-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px
    }

    .flow-step {
      background: var(--panel3);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px
    }

    .flow-step .step-number {
      font: 11px Consolas, monospace;
      color: var(--blue);
      margin-bottom: 7px
    }

    .flow-step strong {
      font: 600 25px Consolas, monospace;
      display: block;
      margin: 12px 0
    }

    .flow-step p {
      font-size: 11px;
      color: var(--muted);
      margin: 6px 0 0
    }

    .sbox-scroll {
      overflow-x: auto;
      padding: 3px
    }

    .sbox-grid {
      display: grid;
      grid-template-columns: 24px repeat(16, minmax(25px, 1fr));
      gap: 3px;
      min-width: 510px
    }

    .sbox-grid .axis {
      font: 10px Consolas, monospace;
      display: grid;
      place-items: center;
      color: var(--muted)
    }

    .sbox-grid button {
      padding: 5px 1px;
      font: 10px Consolas, monospace;
      min-height: 27px;
      border-radius: 4px;
      background: var(--panel3)
    }

    .sbox-grid button.selected {
      outline: 2px solid var(--blue);
      outline-offset: 0;
      background: var(--blue-soft);
      color: var(--blue)
    }

    .sbox-grid .axis.focus {
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 3px
    }

    .byte-field {
      max-width: 110px
    }

    .gf-concepts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 18px
    }

    .gf-concepts article {
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px
    }

    .gf-concepts .eyebrow {
      font-size: 10px;
      letter-spacing: .5px
    }

    .gf-concepts h3 {
      margin-bottom: 9px
    }

    .gf-concepts p {
      font-size: 12px;
      color: var(--muted);
      margin: 0
    }

    .gf-concepts code {
      color: var(--text);
      display: block;
      font-size: 12px;
      margin-top: 12px
    }

    .gf-byte-inputs {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap
    }

    .gf-byte-inputs .field {
      width: 70px
    }

    .gf-byte-inputs input {
      text-align: center;
      font: 17px Consolas, monospace
    }

    .gf-matrix {
      display: grid;
      grid-template-columns: minmax(140px, 1.5fr) minmax(64px, 1fr) minmax(74px, 1fr);
      gap: 8px;
      margin-top: 12px
    }

    .gf-matrix .label {
      font-size: 10px;
      color: var(--muted);
      padding-bottom: 5px;
      text-align: center
    }

    .gf-matrix button {
      font: 13px Consolas, monospace;
      min-height: 44px;
      padding: 8px 4px
    }

    .gf-matrix .vector {
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font: 16px Consolas, monospace;
      background: var(--panel3)
    }

    .term {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 9px;
      margin-top: 8px
    }

    .term code {
      font-size: 12px
    }

    .term small {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6
    }

    .term strong {
      font: 600 17px Consolas, monospace;
      color: var(--green)
    }

    .xtime-stages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px
    }

    .xtime-stages>div {
      background: var(--panel3);
      border: 1px solid var(--line);
      padding: 13px;
      border-radius: 9px
    }

    .xtime-stages code {
      display: block;
      font-size: 15px;
      margin: 8px 0
    }

    .xtime-stages small {
      font-size: 10px;
      color: var(--muted);
      display: block
    }

    .key-word {
      border: 1px solid var(--line);
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px
    }

    .key-word strong {
      color: var(--green);
      font: 600 14px Consolas, monospace
    }

    .key-cascade {
      display: grid;
      gap: 10px
    }

    .key-cascade>div {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel3)
    }

    .key-cascade h4 {
      font-size: 12px;
      color: var(--blue);
      margin-bottom: 8px
    }

    .key-cascade code {
      font-size: 12px;
      overflow-wrap: anywhere
    }

    .key-cascade p {
      margin: 8px 0 0;
      font: 12px Consolas, monospace;
      color: var(--green)
    }

    .mode-flow {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

        return { id: 'dp-input', question: 'Onde fica o primeiro byte do bloco no estado AES?', options: ['s[0,0], início da primeira coluna.', 's[0,1], início da segunda coluna.', 's[1,0], segunda linha.'], correct: 0, explanation: 'O packing é por coluna: n = 4c + r. Para n = 0, temos r = 0 e c = 0.' };
      }
      if (S.tab === 'gf') { const b = S.gfByte, high = Boolean(b & 128); return { id: 'gf-xtime-' + b, question: `Em xtime(${hex2(b)}), depois de deslocar, é preciso aplicar XOR com 1b?`, options: ['Sim, pois o bit b7 original era 1.', 'Não, pois o bit b7 original era 0.', 'Sempre é preciso aplicar XOR com 1b.'], correct: high ? 0 : 1, explanation: `O byte ${hex2(b)} tem b7 = ${high ? 1 : 0}. ${high ? 'Surge x⁸ e a redução é necessária.' : 'Não surge x⁸; o deslocamento já basta.'} O resultado é ${hex2(xtime(b))}.` }; }
      if (S.tab === 'sbox') return S.sboxInv ? { id: 'sb-inv', question: 'Qual é a ordem matemática da S-Box inversa?', options: ['Inversão GF, depois afim direta.', 'Afim inversa, depois inversão GF.', 'RotWord, depois Rcon.'], correct: 1, explanation: 'As operações são desfeitas na ordem inversa: primeiro a transformação afim inversa, depois a inversão multiplicativa.' } : { id: 'sb-fwd', question: 'Como a S-Box direta é construída?', options: ['Somente com ShiftRows.', 'Inversão multiplicativa em GF(2⁸), seguida da transformação afim.', 'XOR com a chave da rodada.'], correct: 1, explanation: 'A construção usa inversão no corpo finito e transformação afim. Zero recebe o tratamento especial 00 → 00 na etapa de inversão.' };
      if (S.tab === 'keys') return { id: 'keys-sbox', question: 'Qual S-Box é usada para recuperar a chave anterior?', options: ['A S-Box inversa.', 'A S-Box direta, assim como na expansão.', 'Nenhuma S-Box.'], correct: 1, explanation: 'A recuperação do key schedule usa a função g com a S-Box direta. Reverter o key schedule não é aplicar InvSubBytes.' };
      if (S.tab === 'modes') { const stream = ['CTR', 'CFB', 'OFB'].includes(S.mode); return { id: 'mode-' + S.mode, question: `Para decifrar em ${S.mode === 'CFB' ? 'CFB-128' : S.mode}, qual núcleo AES é usado?`, options: ['Cipher · AES direto E_K.', 'InvCipher · AES inverso D_K.'], correct: stream ? 0 : 1, explanation: stream ? 'O núcleo direto gera o keystream. O XOR com os dados desfaz a cifra; InvCipher não é necessário.' : 'Este modo decripta o ciphertext usando D_K. Quando há encadeamento, o XOR correspondente é aplicado depois do núcleo.' }; }
      const i = S.mapByte, range = n => `bus[${127 - 8 * n}:${120 - 8 * n}]`;
      return { id: 'rtl-' + i, question: `Qual slice representa o byte B${i}?`, options: [range(i), range((i + 1) % 16), range((i + 2) % 16)], correct: 0, explanation: `O packing é column-major. B${i} ocupa ${range(i)}, seguindo bus[127 - 8*n -: 8].` };
    }
    function renderQuiz() {
      const q = quizForView(), answer = quizAnswers.get(q.id), answered = answer !== undefined, correct = answer === q.correct;
      const hint = { gf: 'Confira o bit b7 do byte original. A redução depende dele, antes do deslocamento.', sbox: 'Pense nas duas operações da construção matemática e na ordem em que são aplicadas.', keys: 'Recuperar as palavras por XOR não exige inverter a função de substituição.', modes: 'Observe se o AES gera um keystream ou desfaz diretamente a cifra do bloco.', rtl: 'Calcule 127 − 8·n para encontrar o bit mais alto; o slice tem oito bits.', datapath: 'Pense no papel desta operação: substituir, mover ou combinar os dados.' }[S.tab];
      return `<section class="panel quiz-panel" id="quick-quiz" aria-labelledby="quiz-title"><div class="panel-head"><h3 id="quiz-title">Desafio rápido · teste seu entendimento</h3><span class="tag">Opcional · sem bloquear a exploração</span></div><p class="quiz-question">${q.question}</p><div class="quiz-options">${q.options.map((text, i) => btn('quiz-answer', text, { value: i, pressed: answer === i })).join('')}</div>${answered ? `<div class="quiz-feedback ${correct ? 'correct' : 'try-again'}" role="status"><strong>${correct ? 'Isso mesmo.' : 'Tente mais uma vez.'}</strong> ${correct ? q.explanation : hint}</div><div class="button-row small-buttons">${btn('quiz-reset', 'Reiniciar desafio')}${!correct ? btn('quiz-explain', 'Ver explicação') : ''}</div>` : '<p class="scope-note">Escolha uma resposta para receber uma explicação na hora.</p>'}</section>`;
    }
    function rememberLearningDetails() {
      for (const detail of document.querySelectorAll('#main details[data-learning-detail]')) learningDetails.set(detail.dataset.learningDetail, detail.open);
    }
    function wrapInDetails(node, title, cls) {
      const detail = document.createElement('details'); detail.className = cls;
      const summary = document.createElement('summary'); summary.textContent = title; detail.appendChild(summary);
      node.replaceWith(detail); detail.appendChild(node); return detail;
    }
    function enhanceLearningView() {
      const main = $('main');
      if (S.tab === 'datapath') {
        const form = main.querySelector('form[data-form="datapath"]');
        const outer = wrapInDetails(form, 'Entradas · usar outro exemplo ou personalizar chave e bloco', 'inputs-details');
        if (drafts.size && Array.from(drafts.values()).some(d => d.form === 'datapath')) outer.open = true;
        const compare = main.querySelector('.compare'); if (compare) compare.closest('.panel').id = 'state-comparison';
      }
      if (S.tab === 'gf') {
        const form = main.querySelector('form[data-form="gf-byte"]');
        form.insertAdjacentHTML('afterend', renderGFSteps());
        const math = form.closest('.panel').querySelector('.wide-layout');
        if (math) wrapInDetails(math, 'Entender a matemática e os produtos reutilizáveis', 'math-details');
        for (const panel of main.querySelectorAll('.panel')) if (panel.querySelector('h3')?.textContent.startsWith('Saída s′')) panel.id = 'column-result';
      }
      if (S.tab === 'sbox') {
        for (const panel of main.querySelectorAll('.panel')) if (panel.querySelector('h3')?.textContent.includes('· bit a bit')) {
          const heading = panel.querySelector('h3');
          const content = document.createElement('div');
          while (heading.nextSibling && !heading.nextSibling.classList?.contains('rtl-details')) content.appendChild(heading.nextSibling);
          panel.insertBefore(content, heading.nextSibling); wrapInDetails(content, 'Entender a matemática · equações bit a bit', 'math-details');
        }
      }
      for (const detail of main.querySelectorAll('details')) {
        const title = detail.querySelector('summary')?.textContent || '';
        const key = S.expertise + ':' + S.tab + ':' + title; detail.dataset.learningDetail = key;
        if (learningDetails.has(key)) detail.open = learningDetails.get(key);
        else if (detail.matches('.math-details,.rtl-details')) detail.open = S.expertise === 'rtl';
        if (detail.classList.contains('inputs-details') && Array.from(drafts.values()).some(d => d.form === 'datapath')) detail.open = true;
      }
      if (S.guideActive) { const target = main.querySelector(GUIDE[S.guideIndex].target); if (target) target.classList.add('learning-target'); }
    }
    function handleLearningAction(action, value, target) {
      if (action === 'learning-mode') { stopPlayback(); S.expertise = value; render(); return true; }
      if (action === 'guide-start') { S.guideComplete = false; S.expertise = 'learn'; goGuide(0); return true; }
      if (action === 'guide-go') { goGuide(Number(value)); return true; }
      if (action === 'guide-prev') { goGuide(S.guideIndex - 1); return true; }
      if (action === 'guide-resume') { goGuide(S.guideIndex); return true; }
      if (action === 'guide-next') {
        if (S.guideIndex < GUIDE.length - 1) goGuide(S.guideIndex + 1);
        else { S.guideActive = false; S.guidePaused = false; S.guideComplete = true; render(); focusLearning('state-comparison'); toast('Percurso concluído. Continue explorando ou responda ao desafio.'); } return true;
      }
      if (action === 'guide-exit' || action === 'guide-dismiss') { S.guideActive = false; S.guidePaused = false; S.introHidden = true; render(); return true; }
      if (action === 'gf-stage' || action === 'gf-stage-prev' || action === 'gf-stage-next') {
        if (action === 'gf-stage-next' && S.gfStage === 4) { focusLearning('column-result'); return true; }
        S.gfStage = action === 'gf-stage' ? Number(value) : Math.max(0, Math.min(4, S.gfStage + (action === 'gf-stage-prev' ? -1 : 1)));
        render(); focusLearning('xtime-heading'); return true;
      }
      if (action === 'quiz-answer') { const q = quizForView(); quizAnswers.set(q.id, Number(value)); render(); return true; }
      if (action === 'quiz-reset') { quizAnswers.delete(quizForView().id); render(); return true; }
      if (action === 'quiz-explain') { const q = quizForView(); const feedback = document.querySelector('.quiz-feedback'); feedback.textContent = q.explanation; feedback.className = 'quiz-feedback explanation'; return true; }
      return false;
    }
    document.addEventListener('submit', event => {
      const invalid = event.target.querySelector('[aria-invalid="true"]');
      if (!invalid) return;
      for (let node = invalid.parentElement; node; node = node.parentElement)if (node.tagName === 'DETAILS') node.open = true;
      invalid.focus({ preventScroll: true });
    });

    render();</script>
